<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="12" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="vaultAccent" x1="20" y1="16" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Shield Shell -->
  <path d="M32 6 L52 14 C52 38 43 51 32 58 C21 51 12 38 12 14 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#shieldBorder)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#emeraldGlow)" />

  <!-- Inner Vault Lock -->
  <!-- Padlock Shackle -->
  <path d="M26 27 V22 C26 18.686 28.686 16 32 16 C35.314 16 38 18.686 38 22 V27" 
        stroke="url(#vaultAccent)" 
        stroke-width="3.2" 
        stroke-linecap="round" />

  <!-- Padlock Body -->
  <rect x="22.5" y="27" width="19" height="15" rx="3.5" 
        fill="url(#vaultAccent)" />

  <!-- Keyhole Cutout -->
  <circle cx="32" cy="33" r="2.2" fill="#060913" />
  <path d="M30.8 34.2 L33.2 34.2 L33.8 38.5 L30.2 38.5 Z" fill="#060913" />
</svg>
